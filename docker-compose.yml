services:
  postgres:
    image: postgres:13
    container_name: airflow-db
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
      timeout: 3s

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "8081:8081"  # Keycloak sarà accessibile su http://localhost:8081
      - "8080:8080"  # Airflow sarà accessibile su http://localhost:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
      - airflow-webserver
    networks:
      - airflow-net

  airflow-init:
    image: apache/airflow:2.7.0
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow connections create-default-connections
    networks:
      - airflow-net

  redis:
    image: redis:latest
    container_name: airflow-redis
    restart: always
    networks:
      - airflow-net

  airflow-webserver:
    image: apache/airflow:2.7.0
    container_name: airflow-webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW_KEYCLOAK_CLIENT_ID: visivosg
      AIRFLOW_KEYCLOAK_CLIENT_SECRET: OHTR5Hv5WxLlAhzaJujZcISJJwzY9nfE
      KEYCLOAK_INTERNAL_URL : http://keycloak:8080  # Used by Airflow inside Docker
      KEYCLOAK_EXTERNAL_URL : http://localhost:8081  # Used by the user's browser
      KEYCLOAK_REALM: VisIVO
    volumes:
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py  # Mount the config file
      - ./dags:/opt/airflow/dags
    command: webserver
    networks:
      - airflow-net

  airflow-scheduler:
    image: apache/airflow:2.7.0
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    volumes:
      - ./dags:/opt/airflow/dags
    command: scheduler
    networks:
      - airflow-net

  keycloak-db:
    image: postgres:13
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - airflow-net

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: "http://localhost:8081"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8081"
      KC_PROXY: "edge"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]
    depends_on:
        keycloak-db:
          condition: service_started
    networks:
        - airflow-net

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - airflow-webserver
      - keycloak
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENV=production
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=VisIVO
      - KEYCLOAK_CLIENT_ID=visivosg
      - KEYCLOAK_CLIENT_SECRET=YOUR_SECRET
    networks:
      - airflow-net

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8000
      - REACT_APP_KEYCLOAK_URL=http://localhost:8081
      - REACT_APP_KEYCLOAK_REALM=Visivo
      - REACT_APP_KEYCLOAK_CLIENT_ID=visivo-client
    networks:
      - airflow-net

volumes:
  postgres_data:
  keycloak_data:

networks:
  airflow-net: